<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Golf Booking Calendar Icon -->
  
  <!-- Calendar frame -->
  <rect x="30" y="40" width="340" height="240" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Calendar header -->
  <rect x="30" y="40" width="340" height="50" rx="10" fill="#1e40af"/>
  
  <!-- Month/Year text -->
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="#ffffff">Mai 2024</text>
  
  <!-- Day headers -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">
    <text x="55" y="130">Mo</text>
    <text x="115" y="130">Di</text>
    <text x="175" y="130">Mi</text>
    <text x="235" y="130">Do</text>
    <text x="295" y="130">Fr</text>
    <text x="355" y="130">Sa</text>
  </g>
  
  <!-- Calendar day circles -->
  <g fill="#10b981" opacity="0.2">
    <circle cx="55" cy="170" r="18"/>
    <circle cx="115" cy="170" r="18"/>
    <circle cx="235" cy="200" r="18"/>
    <circle cx="295" cy="230" r="18"/>
  </g>
  
  <!-- Calendar days -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">
    <!-- Week 1 -->
    <text x="55" y="175">1</text>
    <text x="115" y="175">2</text>
    <text x="175" y="175">3</text>
    <text x="235" y="175">4</text>
    <text x="295" y="175">5</text>
    <text x="355" y="175">6</text>
    
    <!-- Week 2 -->
    <text x="55" y="205">8</text>
    <text x="115" y="205">9</text>
    <text x="175" y="205">10</text>
    <text x="235" y="205">11</text>
    <text x="295" y="205">12</text>
    <text x="355" y="205">13</text>
    
    <!-- Week 3 -->
    <text x="55" y="235">15</text>
    <text x="115" y="235">16</text>
    <text x="175" y="235">17</text>
    <text x="235" y="235">18</text>
    <text x="295" y="235">19</text>
    <text x="355" y="235">20</text>
  </g>
  
  <!-- Booked days (green) -->
  <g fill="none" stroke="#10b981" stroke-width="3">
    <circle cx="115" cy="170" r="20"/>
    <circle cx="235" cy="200" r="20"/>
    <circle cx="295" cy="230" r="20"/>
  </g>
  
  <!-- Golf flag on booked date -->
  <g transform="translate(235, 190)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#10b981" stroke-width="1"/>
    <polygon points="0,-2 0,3 8,0" fill="#e74c3c"/>
  </g>
</svg>
