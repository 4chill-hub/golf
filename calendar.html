<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Buchungskalender - 4chill.ch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="images/achilles-logo-images.jpg" alt="4chill.ch Logo" class="logo-image">
                <span>4chill.ch</span>
            </a>
            <div class="nav-links" id="navLinks">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="#" class="nav-link" id="logoutLink" onclick="logout(event)">Abmelden</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="calendar-header-banner">
            <div class="header-content">
                <h1>Spielzeit-Kalender</h1>
                <p class="subtitle">Buchen Sie Ihre Spielzeiten am Golf Simulator</p>
            </div>
            <div class="header-graphic">
                <svg width="280" height="200" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Calendar grid background -->
                    <rect x="40" y="40" width="200" height="140" fill="#e0f2fe" rx="8"/>
                    <rect x="45" y="45" width="190" height="130" fill="#ffffff" rx="6" stroke="#1f2937" stroke-width="2"/>
                    
                    <!-- Calendar cells -->
                    <g stroke="#cbd5e1" stroke-width="1">
                        <line x1="45" y1="70" x2="235" y2="70"/>
                        <line x1="45" y1="95" x2="235" y2="95"/>
                        <line x1="45" y1="120" x2="235" y2="120"/>
                        <line x1="45" y1="145" x2="235" y2="145"/>
                        <line x1="78" y1="45" x2="78" y2="175"/>
                        <line x1="111" y1="45" x2="111" y2="175"/>
                        <line x1="144" y1="45" x2="144" y2="175"/>
                        <line x1="177" y1="45" x2="177" y2="175"/>
                        <line x1="210" y1="45" x2="210" y2="175"/>
                    </g>
                    
                    <!-- Calendar days -->
                    <text x="57" y="62" font-size="10" fill="#64748b" text-anchor="middle">Mo</text>
                    <text x="90" y="62" font-size="10" fill="#64748b" text-anchor="middle">Di</text>
                    <text x="123" y="62" font-size="10" fill="#6b7280" font-weight="bold">Mi</text>
                    <text x="156" y="62" font-size="10" fill="#64748b" text-anchor="middle">Do</text>
                    <text x="189" y="62" font-size="10" fill="#64748b" text-anchor="middle">Fr</text>
                    <text x="222" y="62" font-size="10" fill="#4b5563" text-anchor="middle">Sa</text>
                    
                    <!-- Highlighted dates -->
                    <circle cx="123" cy="82" r="6" fill="#6b7280" opacity="0.3"/>
                    <text x="123" y="85" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle">15</text>
                    
                    <circle cx="156" cy="107" r="6" fill="#6b7280" opacity="0.3"/>
                    <text x="156" y="110" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle">20</text>
                    
                    <!-- Clock icon -->
                    <circle cx="50" cy="185" r="8" stroke="#1f2937" stroke-width="2" fill="none"/>
                    <line x1="50" y1="181" x2="50" y2="185" stroke="#1f2937" stroke-width="1.5"/>
                    <line x1="50" y1="185" x2="54" y2="185" stroke="#1f2937" stroke-width="1.5"/>
                </svg>
            </div>
        </div>

        <div class="calendar-layout">
            <!-- Calendar Section -->
            <div class="calendar-section">
                <div class="calendar-controls">
                    <button id="prevMonth" class="btn btn-small">← Vorherig</button>
                    <h2 id="monthYear" class="month-title">Januar 2024</h2>
                    <button id="nextMonth" class="btn btn-small">Nächst →</button>
                </div>

                <div class="calendar">
                    <div class="calendar-header-row">
                        <div class="day-name">Mo</div>
                        <div class="day-name">Di</div>
                        <div class="day-name">Mi</div>
                        <div class="day-name">Do</div>
                        <div class="day-name">Fr</div>
                        <div class="day-name">Sa</div>
                        <div class="day-name">So</div>
                    </div>
                    <div id="calendarDays" class="calendar-days">
                        <!-- Days will be generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Booking Form Section -->
            <div class="booking-section">
                <div class="card">
                    <h3>Neue Buchung</h3>
                    <form id="bookingForm">
                        <div class="form-group">
                            <label for="bookingDate">Datum</label>
                            <input type="date" id="bookingDate" name="date" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="startTime">Startzeit</label>
                                <select id="startTime" name="startTime">
                                    <option value="">-- Startzeit wählen --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="endTime">Endzeit</label>
                                <select id="endTime" name="endTime">
                                    <option value="">-- Endzeit wählen --</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notizen (optional)</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="z.B. Mit Freund..."></textarea>
                        </div>

                        <div id="bookingError" class="error-message" style="display: none;"></div>

                        <button type="submit" class="btn btn-primary full-width">Buchen</button>
                    </form>
                </div>

                <!-- Bookings List -->
                <div class="card">
                    <h3>Ihre Buchungen</h3>
                    <div id="bookingsList" class="bookings-list">
                        <p class="text-muted">Noch keine Buchungen</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 4chill.ch - Golf Simulator Club. All rights reserved.</p>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
