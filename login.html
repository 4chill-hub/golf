<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Anmelden - 4chill.ch</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page" style="background-image: url('images/markusspiske-golf-1486354_1920.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="images/achilles-logo-images.jpg" alt="4chill.ch Logo" class="logo-image">
                <span>4chill.ch</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-layout">
            <div class="auth-graphics">
                <img 
                    src="images/moneyfool-golf-2217600_1920.jpg" 
                    alt="Indoor Golf Simulator" 
                    class="responsive-image"
                >
            </div>
            <div class="auth-card">
                <h1>Anmelden</h1>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Passwort</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary full-width">Anmelden</button>
                </form>

                <div class="auth-footer">
                    <p>Noch kein Konto? <a href="register.html">Registrieren</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 4chill.ch - Golf Simulator Club. All rights reserved.</p>
    </footer>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
